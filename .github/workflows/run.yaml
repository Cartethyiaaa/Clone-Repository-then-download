name: Clone & Upload to GoFile

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Masukkan URL git (contoh: https://github.com/user/repo.git)"
        required: true
      branch:
        description: "Masukkan nama branch (opsional)"
        required: false
        default: ""

jobs:
  clone_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (dummy)
        uses: actions/checkout@v4

      - name: Clone repository (shallow clone --depth=1)
        run: |
          URL="${{ github.event.inputs.repo_url }}"
          BRANCH="${{ github.event.inputs.branch }}"

          echo "URL     = $URL"
          echo "BRANCH  = $BRANCH"

          if [ -z "$BRANCH" ]; then
            echo "Cloning default branch (shallow)..."
            git clone --depth=1 "$URL" repo_clone
          else
            echo "Cloning branch: $BRANCH (shallow)..."
            git clone --depth=1 -b "$BRANCH" "$URL" repo_clone
          fi

      - name: Zip repo
        run: zip -r repo_clone.zip repo_clone

      - name: Upload ke GoFile (store1 → store2)
        id: upload
        run: |
          FILE="repo_clone.zip"

          RESPONSE=$(curl -s -F "file=@$FILE" "https://store1.gofile.io/contents/uploadfile" \
            || curl -s -F "file=@$FILE" "https://store2.gofile.io/contents/uploadfile")

          DOWNLOAD_LINK=$(echo "$RESPONSE" | grep -oP '"downloadPage":"\K[^"]+')

          echo -e "\nDownload link: $DOWNLOAD_LINK\n"

          echo "download_link=$DOWNLOAD_LINK" >> $GITHUB_OUTPUT

      - name: Show download link
        run: |
          echo "== HASIL UPLOAD =="
          echo "${{ steps.upload.outputs.download_link }}"
