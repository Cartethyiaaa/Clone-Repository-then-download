name: Clone & Upload to GoFile

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Masukkan URL git yang mau di-clone"
        required: true

jobs:
  clone_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (dummy)
        uses: actions/checkout@v4

      - name: Clone repository from user input
        run: |
          echo "Cloning: ${{ github.event.inputs.repo_url }}"
          git clone "${{ github.event.inputs.repo_url }}" repo_clone

      - name: Zip the cloned repo
        run: |
          zip -r repo_clone.zip repo_clone

      - name: Upload to GoFile
        id: upload
        run: |
          FILE="repo_clone.zip"
          echo "Uploading to GoFile..."

          RESPONSE=$(curl -s -F "file=@$FILE" "https://store1.gofile.io/contents/uploadfile" \
            || curl -s -F "file=@$FILE" "https://store2.gofile.io/contents/uploadfile")

          DOWNLOAD_LINK=$(echo "$RESPONSE" | grep -oP '"downloadPage":"\K[^"]+')

          echo -e "\nDownload link: $DOWNLOAD_LINK\n"

          # Export link ke output
          echo "download_link=$DOWNLOAD_LINK" >> $GITHUB_OUTPUT

      - name: Show Download Link
        run: |
          echo "== LINK HASIL UPLOAD GoFile =="
          echo "${{ steps.upload.outputs.download_link }}"
